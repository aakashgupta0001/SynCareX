name: Backend PostgreSQL tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create temporary least-privilege test database
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          TEST_DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          psql "postgresql://postgres:$POSTGRES_PASSWORD@localhost:5432/postgres" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE syncarex_test LOGIN PASSWORD '$TEST_DB_PASSWORD' NOSUPERUSER NOCREATEDB NOCREATEROLE;" \
            -c "CREATE DATABASE syncarex_test OWNER syncarex_test;"
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Apply database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://syncarex_test:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/syncarex_test
        run: alembic upgrade head
      - name: Run backend tests against PostgreSQL
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://syncarex_test:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/syncarex_test
        run: pytest
