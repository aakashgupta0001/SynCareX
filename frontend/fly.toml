# Fly.io configuration for the SynCareX PWA (nginx serving the built app
# and reverse-proxying /api to the backend service).
app = "syncarex-web-1de1"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
