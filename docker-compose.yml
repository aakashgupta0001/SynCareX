services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:?Set APP_ENV in .env (production for a real deployment)}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}
      COOKIE_SECURE: ${COOKIE_SECURE:?Set COOKIE_SECURE in .env (true for any TLS deployment)}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-[]}
      OFFLINE_GRACE_DAYS: ${OFFLINE_GRACE_DAYS:-7}
      MAX_DOCUMENT_BYTES: ${MAX_DOCUMENT_BYTES:-10485760}
      SYNC_BATCH_LIMIT: ${SYNC_BATCH_LIMIT:-50}
      DOCUMENT_STORAGE_DIR: /var/syncarex/documents
    volumes:
      - documents-data:/var/syncarex/documents
    # Migrations run inside the container command before the server binds.

  # One-shot administrator seeding for a fresh database. Run with:
  #   docker compose --profile seed run --rm backend-seed
  # Production startup refuses SEED_ADMIN_PASSWORD, so this runs with
  # APP_ENV=development on purpose. Change the admin password immediately
  # after the first sign-in, and remove it from .env afterwards.
  backend-seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?Set SEED_ADMIN_EMAIL in .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env (min 12 characters)}
    command: ["python", "-m", "app.seed"]

volumes:
  postgres-data:
  documents-data:
